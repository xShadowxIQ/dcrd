name: Security Audit
on:
  workflow_dispatch:
  push:
    branches: [audit-lab]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
      - name: Run targeted tests
        run: |
          go test ./internal/blockchain/... ./blockchain/stake/...
      - name: Run short fuzzers
        run: |
          go test ./internal/blockchain/... -run '^$' -fuzz=Fuzz -fuzztime=20s
