name: Security Audit\non:\n  workflow_dispatch:\n  push:\n    branches: [audit-lab]\npermissions:\n  contents: read\njobs:\n  audit:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-go@v7\n        with:\n          go-version: '1.25'\n      - name: Run targeted tests\n        run: |\n          go test ./internal/blockchain/... ./blockchain/stake/...\n      - name: Run short fuzzers\n        run: |\n          go test ./internal/blockchain/... -run '^$' -fuzz=Fuzz -fuzztime=20s\n